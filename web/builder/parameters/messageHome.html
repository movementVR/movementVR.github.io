<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
  
	
		   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Show?</div>
		 <div class="inputs-type inputs">
		<input id="messagesscript-stage2_displaymessageflag_false" name="messagesScript,stage2_displayMessageFlag" type="hidden" value="FALSE">
		<input id="messagesscript-stage2_displaymessageflag_true" name="messagesScript,stage2_displayMessageFlag" type="checkbox" value="TRUE">	
		<label for="messagesscript-stage2_displaymessageflag_true" class="label-after-input label-end-block">Yes</label>	 
		</div>    
</fieldset>   
	
		<div class="fullrow-type largespace"></div>   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Message:</div>
		 <div class="inputs-type inputs">      
		<!-- <label for="messagesscript-origintext" class="label-before-input label-start-block"></label> -->
		<textarea id="messagesscript-origintext" name="messagesScript,originText"></textarea>
		</div>  
</fieldset>   
	 




	<!-- Expandable Origin Message Bubble -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableOriginMessageBubble"><span>
	Expand bubble appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableOriginMessageBubble"> 
 
	
<fieldset class="trial-builder-group">     
		<div class="name-type name">Position [m]: </div>
		 <div class="inputs-type inputs">
		<label for="setupscript-originmessagepositionx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-originmessagepositionx" name="setupScript,originMessagePositionX" type="number" step="any">
		<label for="setupscript-originmessagepositiony" class="label-before-input">Y:</label>
		<input id="setupscript-originmessagepositiony" name="setupScript,originMessagePositionY" type="number" step="any">
		<label for="setupscript-originmessagepositionz" class="label-before-input">Z:</label>
		<input id="setupscript-originmessagepositionz" name="setupScript,originMessagePositionZ" type="number" step="any">
		</div>  
</fieldset>	
			
		<div class="fullrow-type mediumspace"></div>   
<fieldset class="trial-builder-group">     
		<div class="name-type name">Orientation [deg]: </div>
		<div class="inputs-type inputs">
			<input id="setupscript-originmessagebackgroundrotationz" name="setupScript,originMessageBackgroundRotationZ" type="number" step="any">  
		</div> 
</fieldset>
			
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Size [m]:</div>
		 <div class="inputs-type inputs">
		<label for="setupscript-originmessagesizex" class="label-before-input label-start-block">Width:</label>
		<input id="setupscript-originmessagesizex" name="setupScript,originMessageSizeX" type="number" step="any" min="0">
		<label for="setupscript-originmessagesizey" class="label-before-input">Height:</label>
		<input id="setupscript-originmessagesizey" name="setupScript,originMessageSizeY" type="number" step="any" min="0">
		</div>   
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>
<fieldset class="trial-builder-group">    
		<div class="name-type name">Shape:</div> 
	<div class="inputs-type inputs">              
		<input id="setupscript-originmessagetype_cartoon" name="setupScript,originMessageType" type="radio" value="cartoon">
		<label for="setupscript-originmessagetype_cartoon" class="label-after-input">Cartoon</label> 
		<input id="setupscript-originmessagetype_rectangle" name="setupScript,originMessageType" type="radio" value="rectangle">
		<label for="setupscript-originmessagetype_rectangle" class="label-after-input">Rectangle</label>                 
		<input id="setupscript-originmessagetype_none" name="setupScript,originMessageType" type="radio" value="none">
		<label for="setupscript-originmessagetype_none" class="label-after-input">None</label> 
	</div> 
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">     
		<div class="name-type name">Color:</div> 			
		 <div class="inputs-type inputs">  
		<input type="color" id="setupscript-originmessagebackgroundcolor_picker" class="picker-color helper-input">
		<label for="setupscript-originmessagebackgroundcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-originmessagebackgroundcolorr" name="setupScript,originMessageBackgroundColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-originmessagebackgroundcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-originmessagebackgroundcolorg" name="setupScript,originMessageBackgroundColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-originmessagebackgroundcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-originmessagebackgroundcolorb" name="setupScript,originMessageBackgroundColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-originmessagebackgroundcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-originmessagebackgroundcoloralpha" name="setupScript,originMessageBackgroundColorAlpha" type="number" step="any" min="0" max="1">
		</div>   	
</fieldset>

	</div> <!-- END of expandable window -->
	
			
			
			
			
			<!-- Expandable Origin Message Text -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableOriginMessageText"><span>
	Expand text appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableOriginMessageText">  
			
<fieldset class="trial-builder-group">  
		<div class="name-type name">Position [m]:</div>  
		<div class="inputs-type inputs">
		<label for="setupscript-originmessagetextoffsetx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-originmessagetextoffsetx" name="setupScript,originMessageTextOffsetX" type="number" step="any">
		<label for="setupscript-originmessagetextoffsety" class="label-before-input">Y:</label>
		<input id="setupscript-originmessagetextoffsety" name="setupScript,originMessageTextOffsetY" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Orientation [deg]:</div>   
		<div class="inputs-type inputs"> 
		<input id="setupscript-originmessagetextrotationz" name="setupScript,originMessageTextRotationZ" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Font size:</div>  
		 <div class="inputs-type inputs"> 
		<input id="setupscript-originmessagefontsize" name="setupScript,originMessageFontSize" type="number" step="any" min="0"> 
		</div>   
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Color:</div> 	
		<div class="inputs-type inputs"> 
		<input type="color" id="setupscript-originmessagetextcolor_picker" class="picker-color helper-input">
		<label for="setupscript-originmessagetextcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-originmessagetextcolorr" name="setupScript,originMessageTextColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-originmessagetextcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-originmessagetextcolorg" name="setupScript,originMessageTextColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-originmessagetextcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-originmessagetextcolorb" name="setupScript,originMessageTextColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-originmessagetextcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-originmessagetextcoloralpha" name="setupScript,originMessageTextColorAlpha" type="number" step="any" min="0" max="1">
		</div>  
</fieldset>   
	  

		</div> <!-- END of expandable window -->




 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
