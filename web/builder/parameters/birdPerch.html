<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
 
  
	

    <fieldset class="trial-builder-group">
    <div class="name-type name">Position [m]:</div> 
         <div class="inputs-type inputs">
        <label for="setupscript-targetperchpositionoffsetx" class="label-before-input label-start-block">X:</label>
        <input id="setupscript-targetperchpositionoffsetx" name="setupScript,targetPerchPositionOffsetX" type="number" step="any">
        <label for="setupscript-targetperchpositionoffsety" class="label-before-input">Y:</label>
        <input id="setupscript-targetperchpositionoffsety" name="setupScript,targetPerchPositionOffsetY" type="number" step="any">
        <label for="setupscript-targetperchpositionoffsetz" class="label-before-input">Z:</label>
        <input id="setupscript-targetperchpositionoffsetz" name="setupScript,targetPerchPositionOffsetZ" type="number" step="any">
        </div> 
        <div class="name-type namenote">(wrt target center)&ensp;</div>  
</fieldset>
        <div class="fullrow-type largespace"></div>
		
<fieldset class="trial-builder-group">
        <div class="name-type name">Size [m]:</div>
         <div class="inputs-type inputs">
        <label for="setupscript-targetperchsizex" class="label-before-input label-start-block">X:</label>
        <input id="setupscript-targetperchsizex" name="setupScript,targetPerchSizeX" type="number" step="any" min="0">
        <label for="setupscript-targetperchsizey" class="label-before-input">Y:</label>
        <input id="setupscript-targetperchsizey" name="setupScript,targetPerchSizeY" type="number" step="any" min="0">
        <label for="setupscript-targetperchsizez" class="label-before-input">Z:</label>
        <input id="setupscript-targetperchsizez" name="setupScript,targetPerchSizeZ" type="number" step="any" min="0">
        </div>     
</fieldset>
	 
 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
