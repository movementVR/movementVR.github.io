<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
  
	
<fieldset class="no-trial-builder-group">    
	<div class="name-type name">System:</div>
		 <div class="inputs-type inputs">
		<input id="setupscript-rigsystem_quest" name="setupScript,rigSystem" type="radio" value="Quest">
		<label for="setupscript-rigsystem_quest" class="label-after-input">Quest</label> 
		<input id="setupscript-rigsystem_leap" name="setupScript,rigSystem" type="radio" value="Leap">
		<label for="setupscript-rigsystem_leap" class="label-after-input label-end-block">Leap</label>		    
		</div>       
</fieldset>   
	
		<div class="fullrow-type largespace"></div>   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Hands used in task:</div>
		 <div class="inputs-type inputs">	    	  	    
		<input id="handsandsavescript-lefthandactiveflag_false" name="handsAndSaveScript,leftHandActiveFlag" type="hidden" value="FALSE">
		<input id="handsandsavescript-lefthandactiveflag_true" name="handsAndSaveScript,leftHandActiveFlag" type="checkbox" value="TRUE">	
		<label for="handsandsavescript-lefthandactiveflag_true" class="label-after-input">Left</label>	
		<input id="handsandsavescript-righthandactiveflag_false" name="handsAndSaveScript,rightHandActiveFlag" type="hidden" value="FALSE">
		<input id="handsandsavescript-righthandactiveflag_true" name="handsAndSaveScript,rightHandActiveFlag" type="checkbox" value="TRUE">	
		<label for="handsandsavescript-righthandactiveflag_true" class="label-after-input label-end-block">Right</label>	  
		</div> 
		<div class="fullrow-type smallspace"></div><div class="inputs-type inputsnote">Check both for bimanual tasks, check one for unimanual</div> 
		<div class="inputs-type inputsnote">Unchecked hands are not be visible in VR</div> 
		<div class="inputs-type inputsnote">&emsp; & cannot interact with objects</div> 
</fieldset>   
	
		<div class="fullrow-type largespace"></div>   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Must be visible:</div>
		 <div class="inputs-type inputs">	    	  	    
		<input id="handsandsavescript-lefthandtrackingflag_false" name="handsAndSaveScript,leftHandTrackingFlag" type="hidden" value="FALSE">
		<input id="handsandsavescript-lefthandtrackingflag_true" name="handsAndSaveScript,leftHandTrackingFlag" type="checkbox" value="TRUE">	
		<label for="handsandsavescript-lefthandtrackingflag_true" class="label-after-input">Left</label>	
		<input id="handsandsavescript-righthandtrackingflag_false" name="handsAndSaveScript,rightHandTrackingFlag" type="hidden" value="FALSE">
		<input id="handsandsavescript-righthandtrackingflag_true" name="handsAndSaveScript,rightHandTrackingFlag" type="checkbox" value="TRUE">	
		<label for="handsandsavescript-righthandtrackingflag_true" class="label-after-input label-end-block">Right</label>	  
		</div> 
		<div class="fullrow-type smallspace"></div><div class="inputs-type inputsnote">Plate freezes if selected hands are not tracked by cameras</div>  
</fieldset>   
	 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
