<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
  
	

    <fieldset class="trial-builder-group">
    <div class="name-type name">Volume [0 to 1]</div>
         
        <div class="fullrow-type smallspace"></div>
         
        <div class="name-type subname">Target bird:</div>
         <div class="inputs-type inputs">      
        <label for="setupscript-targetbirdvolume" class="label-before-input label-start-block">Chirp:</label>
        <input id="setupscript-targetbirdvolume" name="setupScript,targetBirdVolume" type="number" step="any" min="0" max="1">
        </div>     
        <div class="fullrow-type smallspace"></div>     
        <div class="name-type subname">Background birds:</div> 
         <div class="inputs-type inputs">
        <label for="setupscript-backgroundbirdchirpvolume" class="label-before-input label-start-block">Chirp:</label>
        <input id="setupscript-backgroundbirdchirpvolume" name="setupScript,backgroundBirdChirpVolume" type="number" step="any" min="0" max="1">
        <label for="setupscript-backgroundbirdflyawayvolume" class="label-before-input">Wings:</label>
        <input id="setupscript-backgroundbirdflyawayvolume" name="setupScript,backgroundBirdFlyawayVolume" type="number" step="any" min="0" max="1">
        </div>  
</fieldset>
		
	<div class="longnote-type longnotetitle">Success & Failure:</div>   	
		<div class="longnote-type longnote">replace .wav files in app folder</div>
		<div class="longnote-type longnotesmaller">(see "Instructions" in main window)</div>
	
	 
 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
