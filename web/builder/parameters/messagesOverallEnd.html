<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
  
 
<fieldset class="trial-builder-group">   
	<div class="name-type name">Message:</div>
		 <div class="inputs-type inputs">      
		<!-- <label for="messagesscript-endtext" class="label-before-input label-start-block"></label> -->
		<textarea id="messagesscript-endtext" name="messagesScript,endText"></textarea>
		</div>  
</fieldset>   
	 




	<!-- Expandable End Message Bubble -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableEndMessageBubble"><span>
	Expand bubble appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableEndMessageBubble"> 
 
	
<fieldset class="trial-builder-group">     
		<div class="name-type name">Position [m]: </div>
		 <div class="inputs-type inputs">
		<label for="setupscript-endmessagepositionx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-endmessagepositionx" name="setupScript,endMessagePositionX" type="number" step="any">
		<label for="setupscript-endmessagepositiony" class="label-before-input">Y:</label>
		<input id="setupscript-endmessagepositiony" name="setupScript,endMessagePositionY" type="number" step="any">
		<label for="setupscript-endmessagepositionz" class="label-before-input">Z:</label>
		<input id="setupscript-endmessagepositionz" name="setupScript,endMessagePositionZ" type="number" step="any">
		</div>  
</fieldset>	
			
		<div class="fullrow-type mediumspace"></div>   
<fieldset class="trial-builder-group">     
		<div class="name-type name">Orientation [deg]: </div>
		<div class="inputs-type inputs">
			<input id="setupscript-endmessagebackgroundrotationz" name="setupScript,endMessageBackgroundRotationZ" type="number" step="any">  
		</div> 
</fieldset>
			
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Size [m]:</div>
		 <div class="inputs-type inputs">
		<label for="setupscript-endmessagesizex" class="label-before-input label-start-block">Width:</label>
		<input id="setupscript-endmessagesizex" name="setupScript,endMessageSizeX" type="number" step="any" min="0">
		<label for="setupscript-endmessagesizey" class="label-before-input">Height:</label>
		<input id="setupscript-endmessagesizey" name="setupScript,endMessageSizeY" type="number" step="any" min="0">
		</div>   
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>
<fieldset class="trial-builder-group">    
		<div class="name-type name">Shape:</div> 
	<div class="inputs-type inputs">              
		<input id="setupscript-endmessagetype_cartoon" name="setupScript,endMessageType" type="radio" value="cartoon">
		<label for="setupscript-endmessagetype_cartoon" class="label-after-input">Cartoon</label> 
		<input id="setupscript-endmessagetype_rectangle" name="setupScript,endMessageType" type="radio" value="rectangle">
		<label for="setupscript-endmessagetype_rectangle" class="label-after-input">Rectangle</label>                 
		<input id="setupscript-endmessagetype_none" name="setupScript,endMessageType" type="radio" value="none">
		<label for="setupscript-endmessagetype_none" class="label-after-input">None</label> 
	</div> 
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">     
		<div class="name-type name">Color:</div> 			
		 <div class="inputs-type inputs">  
		<input type="color" id="setupscript-endmessagebackgroundcolor_picker" class="picker-color helper-input">
		<label for="setupscript-endmessagebackgroundcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-endmessagebackgroundcolorr" name="setupScript,endMessageBackgroundColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-endmessagebackgroundcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-endmessagebackgroundcolorg" name="setupScript,endMessageBackgroundColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-endmessagebackgroundcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-endmessagebackgroundcolorb" name="setupScript,endMessageBackgroundColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-endmessagebackgroundcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-endmessagebackgroundcoloralpha" name="setupScript,endMessageBackgroundColorAlpha" type="number" step="any" min="0" max="1">
		</div>   	
</fieldset>

	</div> <!-- END of expandable window -->
	
			
			
			
			
			<!-- Expandable End Message Text -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableEndMessageText"><span>
	Expand text appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableEndMessageText">  
			
<fieldset class="trial-builder-group">  
		<div class="name-type name">Position [m]:</div>  
		<div class="inputs-type inputs">
		<label for="setupscript-endmessagetextoffsetx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-endmessagetextoffsetx" name="setupScript,endMessageTextOffsetX" type="number" step="any">
		<label for="setupscript-endmessagetextoffsety" class="label-before-input">Y:</label>
		<input id="setupscript-endmessagetextoffsety" name="setupScript,endMessageTextOffsetY" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Orientation [deg]:</div>   
		<div class="inputs-type inputs"> 
		<input id="setupscript-endmessagetextrotationz" name="setupScript,endMessageTextRotationZ" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Font size:</div>  
		 <div class="inputs-type inputs"> 
		<input id="setupscript-endmessagefontsize" name="setupScript,endMessageFontSize" type="number" step="any" min="0"> 
		</div>   
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Color:</div> 	
		<div class="inputs-type inputs"> 
		<input type="color" id="setupscript-endmessagetextcolor_picker" class="picker-color helper-input">
		<label for="setupscript-endmessagetextcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-endmessagetextcolorr" name="setupScript,endMessageTextColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-endmessagetextcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-endmessagetextcolorg" name="setupScript,endMessageTextColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-endmessagetextcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-endmessagetextcolorb" name="setupScript,endMessageTextColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-endmessagetextcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-endmessagetextcoloralpha" name="setupScript,endMessageTextColorAlpha" type="number" step="any" min="0" max="1">
		</div>  
</fieldset>   
	  

		</div> <!-- END of expandable window -->




 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
