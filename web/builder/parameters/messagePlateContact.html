<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
  
	
		   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Show?</div>
		 <div class="inputs-type inputs">
		<input id="messagesscript-stage3_displaymessageflag_false" name="messagesScript,stage3_displayMessageFlag" type="hidden" value="FALSE">
		<input id="messagesscript-stage3_displaymessageflag_true" name="messagesScript,stage3_displayMessageFlag" type="checkbox" value="TRUE">	
		<label for="messagesscript-stage3_displaymessageflag_true" class="label-after-input label-end-block">Yes</label>	 
		</div>    
</fieldset>   
	
		<div class="fullrow-type largespace"></div>   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Message:</div>
		 <div class="inputs-type inputs">      
		<!-- <label for="messagesscript-contacttext" class="label-before-input label-start-block"></label> -->
		<textarea id="messagesscript-contacttext" name="messagesScript,contactText"></textarea>
		</div>  
</fieldset>   
	 




	<!-- Expandable Contact Message Bubble -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableContactMessageBubble"><span>
	Expand bubble appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableContactMessageBubble"> 
 
	
<fieldset class="trial-builder-group">     
		<div class="name-type name">Position [m]: </div>
		 <div class="inputs-type inputs">
		<label for="setupscript-contactmessagepositionx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-contactmessagepositionx" name="setupScript,contactMessagePositionX" type="number" step="any">
		<label for="setupscript-contactmessagepositiony" class="label-before-input">Y:</label>
		<input id="setupscript-contactmessagepositiony" name="setupScript,contactMessagePositionY" type="number" step="any">
		<label for="setupscript-contactmessagepositionz" class="label-before-input">Z:</label>
		<input id="setupscript-contactmessagepositionz" name="setupScript,contactMessagePositionZ" type="number" step="any">
		</div>  
</fieldset>	
			
		<div class="fullrow-type mediumspace"></div>   
<fieldset class="trial-builder-group">     
		<div class="name-type name">Orientation [deg]: </div>
		<div class="inputs-type inputs">
			<input id="setupscript-contactmessagebackgroundrotationz" name="setupScript,contactMessageBackgroundRotationZ" type="number" step="any">  
		</div> 
</fieldset>
			
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Size [m]:</div>
		 <div class="inputs-type inputs">
		<label for="setupscript-contactmessagesizex" class="label-before-input label-start-block">Width:</label>
		<input id="setupscript-contactmessagesizex" name="setupScript,contactMessageSizeX" type="number" step="any" min="0">
		<label for="setupscript-contactmessagesizey" class="label-before-input">Height:</label>
		<input id="setupscript-contactmessagesizey" name="setupScript,contactMessageSizeY" type="number" step="any" min="0">
		</div>   
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>
<fieldset class="trial-builder-group">    
		<div class="name-type name">Shape:</div> 
	<div class="inputs-type inputs">              
		<input id="setupscript-contactmessagetype_cartoon" name="setupScript,contactMessageType" type="radio" value="cartoon">
		<label for="setupscript-contactmessagetype_cartoon" class="label-after-input">Cartoon</label> 
		<input id="setupscript-contactmessagetype_rectangle" name="setupScript,contactMessageType" type="radio" value="rectangle">
		<label for="setupscript-contactmessagetype_rectangle" class="label-after-input">Rectangle</label>                 
		<input id="setupscript-contactmessagetype_none" name="setupScript,contactMessageType" type="radio" value="none">
		<label for="setupscript-contactmessagetype_none" class="label-after-input">None</label> 
	</div> 
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">     
		<div class="name-type name">Color:</div> 			
		 <div class="inputs-type inputs">  
		<input type="color" id="setupscript-contactmessagebackgroundcolor_picker" class="picker-color helper-input">
		<label for="setupscript-contactmessagebackgroundcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-contactmessagebackgroundcolorr" name="setupScript,contactMessageBackgroundColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-contactmessagebackgroundcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-contactmessagebackgroundcolorg" name="setupScript,contactMessageBackgroundColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-contactmessagebackgroundcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-contactmessagebackgroundcolorb" name="setupScript,contactMessageBackgroundColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-contactmessagebackgroundcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-contactmessagebackgroundcoloralpha" name="setupScript,contactMessageBackgroundColorAlpha" type="number" step="any" min="0" max="1">
		</div>   	
</fieldset>

	</div> <!-- END of expandable window -->
	
			
			
			
			
			<!-- Expandable Contact Message Text -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableContactMessageText"><span>
	Expand text appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableContactMessageText">  
			
<fieldset class="trial-builder-group">  
		<div class="name-type name">Position [m]:</div>  
		<div class="inputs-type inputs">
		<label for="setupscript-contactmessagetextoffsetx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-contactmessagetextoffsetx" name="setupScript,contactMessageTextOffsetX" type="number" step="any">
		<label for="setupscript-contactmessagetextoffsety" class="label-before-input">Y:</label>
		<input id="setupscript-contactmessagetextoffsety" name="setupScript,contactMessageTextOffsetY" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Orientation [deg]:</div>   
		<div class="inputs-type inputs"> 
		<input id="setupscript-contactmessagetextrotationz" name="setupScript,contactMessageTextRotationZ" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Font size:</div>  
		 <div class="inputs-type inputs"> 
		<input id="setupscript-contactmessagefontsize" name="setupScript,contactMessageFontSize" type="number" step="any" min="0"> 
		</div>   
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Color:</div> 	
		<div class="inputs-type inputs"> 
		<input type="color" id="setupscript-contactmessagetextcolor_picker" class="picker-color helper-input">
		<label for="setupscript-contactmessagetextcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-contactmessagetextcolorr" name="setupScript,contactMessageTextColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-contactmessagetextcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-contactmessagetextcolorg" name="setupScript,contactMessageTextColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-contactmessagetextcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-contactmessagetextcolorb" name="setupScript,contactMessageTextColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-contactmessagetextcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-contactmessagetextcoloralpha" name="setupScript,contactMessageTextColorAlpha" type="number" step="any" min="0" max="1">
		</div>  
</fieldset>   
	  

		</div> <!-- END of expandable window -->




 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
