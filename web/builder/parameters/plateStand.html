<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
 
	
		 
<fieldset class="trial-builder-group"> 
	<div class="name-type name">Size [m]:</div>
		 <div class="inputs-type inputs">
		<label for="setupscript-platestandsizex" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-platestandsizex" name="setupScript,plateStandSizeX" type="number" step="any" min="0">
		<label for="setupscript-platestandsizez" class="label-before-input">Z:</label>
		<input id="setupscript-platestandsizez" name="setupScript,plateStandSizeZ" type="number" step="any" min="0">
		</div>
		<div class="fullrow-type smallspace"></div><div class="inputs-type inputsnote">Y is set automatically from plate starting position</div>   	
</fieldset>   
 
	
		<div class="fullrow-type largespace"></div> 
<fieldset class="trial-builder-group"> 
	<div class="name-type name">Color: </div>
		 <div class="inputs-type inputs">
		<input type="color" id="setupscript-platestandcolor_picker" class="picker-color helper-input">
		<label for="setupscript-platestandcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-platestandcolorr" name="setupScript,plateStandColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-platestandcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-platestandcolorg" name="setupScript,plateStandColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-platestandcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-platestandcolorb" name="setupScript,plateStandColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-platestandcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-platestandcoloralpha" name="setupScript,plateStandColorAlpha" type="number" step="any" min="0" max="1">
		</div>   	
</fieldset> 
	 
 
 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
