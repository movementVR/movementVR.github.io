<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
  
	
		   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Show?</div>
		 <div class="inputs-type inputs">
		<input id="messagesscript-stage1_displaymessageflag_false" name="messagesScript,stage1_displayMessageFlag" type="hidden" value="FALSE">
		<input id="messagesscript-stage1_displaymessageflag_true" name="messagesScript,stage1_displayMessageFlag" type="checkbox" value="TRUE">	
		<label for="messagesscript-stage1_displaymessageflag_true" class="label-after-input label-end-block">Yes</label>	 
		</div>    
</fieldset>   
	
		<div class="fullrow-type largespace"></div>   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Message:</div>
		 <div class="inputs-type inputs">      
		<!-- <label for="messagesscript-basetext" class="label-before-input label-start-block"></label> -->
		<textarea id="messagesscript-basetext" name="messagesScript,baseText"></textarea>
		</div>  
</fieldset>   
	 




	<!-- Expandable Base Message Bubble -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableBaseMessageBubble"><span>
	Expand bubble appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableBaseMessageBubble"> 
 
	
<fieldset class="trial-builder-group">     
		<div class="name-type name">Position [m]: </div>
		 <div class="inputs-type inputs">
		<label for="setupscript-basemessagepositionx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-basemessagepositionx" name="setupScript,baseMessagePositionX" type="number" step="any">
		<label for="setupscript-basemessagepositiony" class="label-before-input">Y:</label>
		<input id="setupscript-basemessagepositiony" name="setupScript,baseMessagePositionY" type="number" step="any">
		<label for="setupscript-basemessagepositionz" class="label-before-input">Z:</label>
		<input id="setupscript-basemessagepositionz" name="setupScript,baseMessagePositionZ" type="number" step="any">
		</div>  
</fieldset>	
			
		<div class="fullrow-type mediumspace"></div>   
<fieldset class="trial-builder-group">     
		<div class="name-type name">Orientation [deg]: </div>
		<div class="inputs-type inputs">
			<input id="setupscript-basemessagebackgroundrotationz" name="setupScript,baseMessageBackgroundRotationZ" type="number" step="any">  
		</div> 
</fieldset>
			
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Size [m]:</div>
		 <div class="inputs-type inputs">
		<label for="setupscript-basemessagesizex" class="label-before-input label-start-block">Width:</label>
		<input id="setupscript-basemessagesizex" name="setupScript,baseMessageSizeX" type="number" step="any" min="0">
		<label for="setupscript-basemessagesizey" class="label-before-input">Height:</label>
		<input id="setupscript-basemessagesizey" name="setupScript,baseMessageSizeY" type="number" step="any" min="0">
		</div>   
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>
<fieldset class="trial-builder-group">    
		<div class="name-type name">Shape:</div> 
	<div class="inputs-type inputs">              
		<input id="setupscript-basemessagetype_cartoon" name="setupScript,baseMessageType" type="radio" value="cartoon">
		<label for="setupscript-basemessagetype_cartoon" class="label-after-input">Cartoon</label> 
		<input id="setupscript-basemessagetype_rectangle" name="setupScript,baseMessageType" type="radio" value="rectangle">
		<label for="setupscript-basemessagetype_rectangle" class="label-after-input">Rectangle</label>                 
		<input id="setupscript-basemessagetype_none" name="setupScript,baseMessageType" type="radio" value="none">
		<label for="setupscript-basemessagetype_none" class="label-after-input">None</label> 
	</div> 
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">     
		<div class="name-type name">Color:</div> 			
		 <div class="inputs-type inputs">  
		<input type="color" id="setupscript-basemessagebackgroundcolor_picker" class="picker-color helper-input">
		<label for="setupscript-basemessagebackgroundcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-basemessagebackgroundcolorr" name="setupScript,baseMessageBackgroundColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-basemessagebackgroundcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-basemessagebackgroundcolorg" name="setupScript,baseMessageBackgroundColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-basemessagebackgroundcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-basemessagebackgroundcolorb" name="setupScript,baseMessageBackgroundColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-basemessagebackgroundcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-basemessagebackgroundcoloralpha" name="setupScript,baseMessageBackgroundColorAlpha" type="number" step="any" min="0" max="1">
		</div>   	
</fieldset>

	</div> <!-- END of expandable window -->
	
			
			
			
			
			<!-- Expandable Base Message Text -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableBaseMessageText"><span>
	Expand text appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableBaseMessageText">  
			
<fieldset class="trial-builder-group">  
		<div class="name-type name">Position [m]:</div>  
		<div class="inputs-type inputs">
		<label for="setupscript-basemessagetextoffsetx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-basemessagetextoffsetx" name="setupScript,baseMessageTextOffsetX" type="number" step="any">
		<label for="setupscript-basemessagetextoffsety" class="label-before-input">Y:</label>
		<input id="setupscript-basemessagetextoffsety" name="setupScript,baseMessageTextOffsetY" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Orientation [deg]:</div>   
		<div class="inputs-type inputs"> 
		<input id="setupscript-basemessagetextrotationz" name="setupScript,baseMessageTextRotationZ" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Font size:</div>  
		 <div class="inputs-type inputs"> 
		<input id="setupscript-basemessagefontsize" name="setupScript,baseMessageFontSize" type="number" step="any" min="0"> 
		</div>   
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Color:</div> 	
		<div class="inputs-type inputs"> 
		<input type="color" id="setupscript-basemessagetextcolor_picker" class="picker-color helper-input">
		<label for="setupscript-basemessagetextcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-basemessagetextcolorr" name="setupScript,baseMessageTextColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-basemessagetextcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-basemessagetextcolorg" name="setupScript,baseMessageTextColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-basemessagetextcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-basemessagetextcolorb" name="setupScript,baseMessageTextColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-basemessagetextcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-basemessagetextcoloralpha" name="setupScript,baseMessageTextColorAlpha" type="number" step="any" min="0" max="1">
		</div>  
</fieldset>   
	  

		</div> <!-- END of expandable window -->




 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
