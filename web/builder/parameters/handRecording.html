<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
 
  
	
		   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Select data to save:</div>
		 <div class="inputs-type inputs">	    	  	    
		<input id="handsandsavescript-savebasicdata_false" name="handsAndSaveScript,saveBasicData" type="hidden" value="FALSE">
		<input id="handsandsavescript-savebasicdata_true" name="handsAndSaveScript,saveBasicData" type="checkbox" value="TRUE">	
		<label for="handsandsavescript-savebasicdata_true" class="label-after-input label-end-block">Basic data (wrist, plate, & headset positions) </label>	  
		</div>   
	
	<div class="name-type namenote">(for each frame)&emsp;&emsp;</div>		
		 <div class="inputs-type inputs">	    	  	    
		<input id="handsandsavescript-saveperturbationoffset_false" name="handsAndSaveScript,savePerturbationOffset" type="hidden" value="FALSE">
		<input id="handsandsavescript-saveperturbationoffset_true" name="handsAndSaveScript,savePerturbationOffset" type="checkbox" value="TRUE">	
		<label for="handsandsavescript-saveperturbationoffset_true" class="label-after-input label-end-block">Hand perturbation offsets</label>	  
		</div>       
		
		 <div class="inputs-type inputs">	    	  	    
		<input id="handsandsavescript-savefingertipposition_false" name="handsAndSaveScript,saveFingertipPosition" type="hidden" value="FALSE">
		<input id="handsandsavescript-savefingertipposition_true" name="handsAndSaveScript,saveFingertipPosition" type="checkbox" value="TRUE">	
		<label for="handsandsavescript-savefingertipposition_true" class="label-after-input label-end-block">Fingertip positions</label>	  
		</div>       
		
		 <div class="inputs-type inputs">	
		<input id="handsandsavescript-savebonetransforms_false" name="handsAndSaveScript,saveBoneTransforms" type="hidden" value="FALSE">
		<input id="handsandsavescript-savebonetransforms_true" name="handsAndSaveScript,saveBoneTransforms" type="checkbox" value="TRUE">	
		<label for="handsandsavescript-savebonetransforms_true" class="label-after-input label-end-block">All bone transforms</label>	    
		</div>       
		
		 <div class="inputs-type inputs">		
		<input id="handsandsavescript-savebonecollidershapes_false" name="handsAndSaveScript,saveBoneColliderShapes" type="hidden" value="FALSE">
		<input id="handsandsavescript-savebonecollidershapes_true" name="handsAndSaveScript,saveBoneColliderShapes" type="checkbox" value="TRUE">	
		<label for="handsandsavescript-savebonecollidershapes_true" class="label-after-input label-end-block">All bone shapes</label>	  
		</div>     
</fieldset>   
	 

    
 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
