<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
 
 
	
		 
<fieldset class="trial-builder-group"> 
	<div class="name-type name">Success color:</div>
		 <div class="inputs-type inputs">
		<input type="color" id="plateandgrapescript-plategrapecolorsuccess_picker" class="picker-color helper-input">
		<label for="plateandgrapescript-plategrapecolorsuccessr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="plateandgrapescript-plategrapecolorsuccessr" name="plateAndGrapeScript,plateGrapeColorSuccessR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="plateandgrapescript-plategrapecolorsuccessg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="plateandgrapescript-plategrapecolorsuccessg" name="plateAndGrapeScript,plateGrapeColorSuccessG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="plateandgrapescript-plategrapecolorsuccessb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="plateandgrapescript-plategrapecolorsuccessb" name="plateAndGrapeScript,plateGrapeColorSuccessB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="plateandgrapescript-plategrapecolorsuccessalpha" class="label-before-input">Alpha:</label>
		<input id="plateandgrapescript-plategrapecolorsuccessalpha" name="plateAndGrapeScript,plateGrapeColorSuccessAlpha" type="number" step="any" min="0" max="1">
		</div>  	
</fieldset> 
	
<fieldset class="trial-builder-group"> 
	<div class="fullrow-type mediumspace"></div> 
	<div class="name-type name">Failure color:</div>
		 <div class="inputs-type inputs">
		<input type="color" id="plateandgrapescript-plategrapecolorunsuccess_picker" class="picker-color helper-input">
		<label for="plateandgrapescript-plategrapecolorunsuccessr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="plateandgrapescript-plategrapecolorunsuccessr" name="plateAndGrapeScript,plateGrapeColorUnsuccessR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="plateandgrapescript-plategrapecolorunsuccessg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="plateandgrapescript-plategrapecolorunsuccessg" name="plateAndGrapeScript,plateGrapeColorUnsuccessG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="plateandgrapescript-plategrapecolorunsuccessb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="plateandgrapescript-plategrapecolorunsuccessb" name="plateAndGrapeScript,plateGrapeColorUnsuccessB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="plateandgrapescript-plategrapecolorunsuccessalpha" class="label-before-input">Alpha:</label>
		<input id="plateandgrapescript-plategrapecolorunsuccessalpha" name="plateAndGrapeScript,plateGrapeColorUnsuccessAlpha" type="number" step="any" min="0" max="1">
		</div>    	
</fieldset> 
	  
	
	<div class="fullrow-type mediumspace"></div> 
	<div class="longnote-type longnote">Color of particle effect around plate</div>     
		<div class="longnote-type longnotesmaller">shown when plate 1) disappars and 2) reappears on next trial</div>     


 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
    <img src="web/img/parameters/feedbackPlate.png">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
