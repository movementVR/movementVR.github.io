<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
  
	
		   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Home position [m]</div>
		    
		<div class="name-type namenote">(wrt plate starting position)</div>  
		<div class="fullrow-type smallspace"></div>  
		<div class="name-type subname">Left hand:</div>	
		 <div class="inputs-type inputs">
			<label for="setupscript-lefthandstartinginboundpositionx" class="label-before-input label-start-block">X:</label>
			<input id="setupscript-lefthandstartinginboundpositionx" name="setupScript,lefthandStartingInBoundPositionX" type="number" step="any">
			<label for="setupscript-lefthandstartinginboundpositiony" class="label-before-input">Y:</label>
			<input id="setupscript-lefthandstartinginboundpositiony" name="setupScript,lefthandStartingInBoundPositionY" type="number" step="any">
			<label for="setupscript-lefthandstartinginboundpositionz" class="label-before-input">Z:</label>
			<input id="setupscript-lefthandstartinginboundpositionz" name="setupScript,lefthandStartingInBoundPositionZ" type="number" step="any">
		</div>
		<div class="fullrow-type smallspace"></div>
		<div class="name-type subname">Right hand:</div>	 
		 <div class="inputs-type inputs">
			<label for="setupscript-righthandstartinginboundpositionx" class="label-before-input label-start-block">X:</label>
			<input id="setupscript-righthandstartinginboundpositionx" name="setupScript,righthandStartingInBoundPositionX" type="number" step="any">
			<label for="setupscript-righthandstartinginboundpositiony" class="label-before-input">Y:</label>
			<input id="setupscript-righthandstartinginboundpositiony" name="setupScript,righthandStartingInBoundPositionY" type="number" step="any">
			<label for="setupscript-righthandstartinginboundpositionz" class="label-before-input">Z:</label>
			<input id="setupscript-righthandstartinginboundpositionz" name="setupScript,righthandStartingInBoundPositionZ" type="number" step="any">
		</div>
</fieldset>   
	  
 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
    <img src="web/img/parameters/handHomePosition.png" >
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
