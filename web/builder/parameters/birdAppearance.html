<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
        	

    <fieldset class="trial-builder-group">
    <div class="name-type name">Position [m]:</div>
         <div class="inputs-type inputs">
        <label for="setupscript-tgtbirdpositionoffsetx" class="label-before-input label-start-block">X:</label>
        <input id="setupscript-tgtbirdpositionoffsetx" name="setupScript,tgtBirdPositionOffsetX" type="number" step="any">
        <label for="setupscript-tgtbirdpositionoffsety" class="label-before-input">Y:</label>
        <input id="setupscript-tgtbirdpositionoffsety" name="setupScript,tgtBirdPositionOffsetY" type="number" step="any">
        <label for="setupscript-tgtbirdpositionoffsetz" class="label-before-input">Z:</label>
        <input id="setupscript-tgtbirdpositionoffsetz" name="setupScript,tgtBirdPositionOffsetZ" type="number" step="any">
        </div> 
	<div class="name-type namenote">(wrt target center)&ensp;</div>
         <div class="inputs-type inputs">
		<label class="label-standalone">&emsp;</label>
        <input id="setupscript-tgtbirdpositionoffsetystandontargetflag_false" name="setupScript,tgtBirdPositionOffsetYStandOnTargetFlag" type="hidden" value="FALSE">
        <input id="setupscript-tgtbirdpositionoffsetystandontargetflag_true" name="setupScript,tgtBirdPositionOffsetYStandOnTargetFlag" type="checkbox" value="TRUE">
        <label for="setupscript-tgtbirdpositionoffsetystandontargetflag_true" class="label-after-input label-end-block">Set Y automatically (bird rests on target)</label>	
        </div> 
</fieldset>
	
<div class="fullrow-type largespace"></div>
    <fieldset class="trial-builder-group">
    <div class="name-type name">Orientation [deg]:</div>
         <div class="inputs-type inputs">
        <label for="setupscript-tgtbirdrotationx" class="label-before-input label-start-block">X:</label>
        <input id="setupscript-tgtbirdrotationx" name="setupScript,tgtBirdRotationX" type="number" step="any">
        <label for="setupscript-tgtbirdrotationy" class="label-before-input">Y:</label>
        <input id="setupscript-tgtbirdrotationy" name="setupScript,tgtBirdRotationY" type="number" step="any">
        <label for="setupscript-tgtbirdrotationz" class="label-before-input">Z:</label>
        <input id="setupscript-tgtbirdrotationz" name="setupScript,tgtBirdRotationZ" type="number" step="any">
        </div>  
        <div class="name-type namenote"> (0,0,0 = facing user) &ensp;</div> 
</fieldset>
	
<div class="fullrow-type largespace"></div>
    <fieldset class="trial-builder-group">
    <div class="name-type name">Size [m]:</div>
         
        <div class="fullrow-type smallspace"></div>
         
        <div class="name-type subname">Cardinal</div>
         <div class="inputs-type inputs">
        <label for="setupscript-tgtbirdcardinalsizex" class="label-before-input label-start-block">X:</label>
        <input id="setupscript-tgtbirdcardinalsizex" name="setupScript,tgtBirdCardinalSizeX" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdcardinalsizey" class="label-before-input">Y:</label>
        <input id="setupscript-tgtbirdcardinalsizey" name="setupScript,tgtBirdCardinalSizeY" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdcardinalsizez" class="label-before-input">Z:</label>
        <input id="setupscript-tgtbirdcardinalsizez" name="setupScript,tgtBirdCardinalSizeZ" type="number" step="any" min="0">      
        </div>
        <div class="fullrow-type smallspace"></div>
        <div class="name-type subname">Bluejay</div>
         <div class="inputs-type inputs">
        <label for="setupscript-tgtbirdbluejaysizex" class="label-before-input label-start-block">X:</label>
        <input id="setupscript-tgtbirdbluejaysizex" name="setupScript,tgtBirdBluejaySizeX" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdbluejaysizey" class="label-before-input">Y:</label>
        <input id="setupscript-tgtbirdbluejaysizey" name="setupScript,tgtBirdBluejaySizeY" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdbluejaysizez" class="label-before-input">Z:</label>
        <input id="setupscript-tgtbirdbluejaysizez" name="setupScript,tgtBirdBluejaySizeZ" type="number" step="any" min="0">      
        </div>
        <div class="fullrow-type smallspace"></div>
        <div class="name-type subname">Robin</div>
         <div class="inputs-type inputs">
        <label for="setupscript-tgtbirdrobinsizex" class="label-before-input label-start-block">X:</label>
        <input id="setupscript-tgtbirdrobinsizex" name="setupScript,tgtBirdRobinSizeX" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdrobinsizey" class="label-before-input">Y:</label>
        <input id="setupscript-tgtbirdrobinsizey" name="setupScript,tgtBirdRobinSizeY" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdrobinsizez" class="label-before-input">Z:</label>
        <input id="setupscript-tgtbirdrobinsizez" name="setupScript,tgtBirdRobinSizeZ" type="number" step="any" min="0">      
        </div>
        <div class="fullrow-type smallspace"></div>
        <div class="name-type subname">Chickadee</div>
         <div class="inputs-type inputs">
        <label for="setupscript-tgtbirdchickadeesizex" class="label-before-input label-start-block">X:</label>
        <input id="setupscript-tgtbirdchickadeesizex" name="setupScript,tgtBirdChickadeeSizeX" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdchickadeesizey" class="label-before-input">Y:</label>
        <input id="setupscript-tgtbirdchickadeesizey" name="setupScript,tgtBirdChickadeeSizeY" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdchickadeesizez" class="label-before-input">Z:</label>
        <input id="setupscript-tgtbirdchickadeesizez" name="setupScript,tgtBirdChickadeeSizeZ" type="number" step="any" min="0">      
        </div>
        <div class="fullrow-type smallspace"></div>
        <div class="name-type subname">Goldfinch</div>
         <div class="inputs-type inputs">
        <label for="setupscript-tgtbirdgoldfinchsizex" class="label-before-input label-start-block">X:</label>
        <input id="setupscript-tgtbirdgoldfinchsizex" name="setupScript,tgtBirdGoldfinchSizeX" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdgoldfinchsizey" class="label-before-input">Y:</label>
        <input id="setupscript-tgtbirdgoldfinchsizey" name="setupScript,tgtBirdGoldfinchSizeY" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdgoldfinchsizez" class="label-before-input">Z:</label>
        <input id="setupscript-tgtbirdgoldfinchsizez" name="setupScript,tgtBirdGoldfinchSizeZ" type="number" step="any" min="0">      
        </div>
        <div class="fullrow-type smallspace"></div>
        <div class="name-type subname">Sparrow</div>
         <div class="inputs-type inputs">
        <label for="setupscript-tgtbirdsparrowsizex" class="label-before-input label-start-block">X:</label>
        <input id="setupscript-tgtbirdsparrowsizex" name="setupScript,tgtBirdSparrowSizeX" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdsparrowsizey" class="label-before-input">Y:</label>
        <input id="setupscript-tgtbirdsparrowsizey" name="setupScript,tgtBirdSparrowSizeY" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdsparrowsizez" class="label-before-input">Z:</label>
        <input id="setupscript-tgtbirdsparrowsizez" name="setupScript,tgtBirdSparrowSizeZ" type="number" step="any" min="0">      
        </div>         
</fieldset>
	
<div class="fullrow-type largespace"></div>
    <fieldset class="trial-builder-group">
    <div class="name-type name">Scale all by:</div>
         <div class="inputs-type inputs">
        <label for="setupscript-tgtbirdsscalex" class="label-before-input label-start-block">X:</label>
        <input id="setupscript-tgtbirdsscalex" name="setupScript,tgtBirdsScaleX" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdsscaley" class="label-before-input">Y:</label>
        <input id="setupscript-tgtbirdsscaley" name="setupScript,tgtBirdsScaleY" type="number" step="any" min="0">
        <label for="setupscript-tgtbirdsscalez" class="label-before-input">Z:</label>
        <input id="setupscript-tgtbirdsscalez" name="setupScript,tgtBirdsScaleZ" type="number" step="any" min="0">
        </div>  
</fieldset>  
 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
