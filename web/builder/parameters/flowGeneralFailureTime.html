<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: -->  
	

	<fieldset class="trial-builder-group">
	<div class="name-type name">Time limits [s]:</div>
		 <div class="inputs-type inputs"> 
		<label for="trialscript-trial_maxtime" class="label-before-input label-start-block">Entire trial:</label>
		<input id="trialscript-trial_maxtime" name="trialScript,trial_maxTime" type="number" step="any" min="0">
		</div><div class="inputs-type inputs">
		<label for="trialscript-stage2_maxtime" class="label-before-input label-start-block">"Home position" phase: </label>
		<input id="trialscript-stage2_maxtime" name="trialScript,stage2_maxTime" type="number" step="any" min="0">
		</div><div class="inputs-type inputs">
		<label for="trialscript-stage3_maxtime" class="label-before-input label-start-block">"Plate contact" phase: </label>
		<input id="trialscript-stage3_maxtime" name="trialScript,stage3_maxTime" type="number" step="any" min="0">
		</div><div class="inputs-type inputs">
		<label for="trialscript-stage4_maxtime" class="label-before-input label-start-block">"Plate lift" phase: </label>
		<input id="trialscript-stage4_maxtime" name="trialScript,stage4_maxTime" type="number" step="any" min="0">
		</div> 
</fieldset>  
	 
	<div class="longnote-type longnotetitle">If any of these time limits is reached:</div>   
	<div class="longnote-type longnote">Current trial fails &#8594; next trial begins</div>   	
	

<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
