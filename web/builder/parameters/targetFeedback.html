<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
 	 
	
		 
<fieldset class="trial-builder-group"> 
	<div class="name-type name">Success color:</div>  
		 <div class="inputs-type inputs">
	  	<input type="color" id="targetscript-targetmeshcolorsuccess_picker" class="picker-color helper-input">
		<label for="targetscript-targetmeshcolorsuccessr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="targetscript-targetmeshcolorsuccessr" name="targetScript,targetMeshColorSuccessR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="targetscript-targetmeshcolorsuccessg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="targetscript-targetmeshcolorsuccessg" name="targetScript,targetMeshColorSuccessG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="targetscript-targetmeshcolorsuccessb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="targetscript-targetmeshcolorsuccessb" name="targetScript,targetMeshColorSuccessB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="targetscript-targetmeshcolorsuccessalpha" class="label-before-input">Alpha:</label>
		<input id="targetscript-targetmeshcolorsuccessalpha" name="targetScript,targetMeshColorSuccessAlpha" type="number" step="any" min="0" max="1">
		</div>   	
</fieldset> 
	
<fieldset class="trial-builder-group"> 
	<div class="fullrow-type mediumspace"></div> 
	<div class="name-type name">Failure color:</div>
		 <div class="inputs-type inputs">
		<input type="color" id="targetscript-targetmeshcolorunsuccess_picker" class="picker-color helper-input">
		<label for="targetscript-targetmeshcolorunsuccessr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="targetscript-targetmeshcolorunsuccessr" name="targetScript,targetMeshColorUnsuccessR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="targetscript-targetmeshcolorunsuccessg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="targetscript-targetmeshcolorunsuccessg" name="targetScript,targetMeshColorUnsuccessG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="targetscript-targetmeshcolorunsuccessb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="targetscript-targetmeshcolorunsuccessb" name="targetScript,targetMeshColorUnsuccessB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="targetscript-targetmeshcolorunsuccessalpha" class="label-before-input">Alpha:</label>
		<input id="targetscript-targetmeshcolorunsuccessalpha" name="targetScript,targetMeshColorUnsuccessAlpha" type="number" step="any" min="0" max="1">
		</div>  	
</fieldset> 
	
	<div class="fullrow-type mediumspace"></div> 
		<div class="longnote-type longnote">Color changes online based on success criteria (after target is first reached)</div>     


 
 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
    <img src="web/img/parameters/feedbackTarget.png">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
