<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
  
	
		 
<fieldset class="trial-builder-group"> 
	<div class="name-type name">Position [m]:</div>
		 <div class="inputs-type inputs">
		<label for="setupscript-grapelocalpositionx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-grapelocalpositionx" name="setupScript,grapeLocalPositionX" type="number" step="any">
		<label for="setupscript-grapelocalpositiony" class="label-before-input">Y:</label>
		<input id="setupscript-grapelocalpositiony" name="setupScript,grapeLocalPositionY" type="number" step="any">
		<label for="setupscript-grapelocalpositionz" class="label-before-input">Z:</label>
		<input id="setupscript-grapelocalpositionz" name="setupScript,grapeLocalPositionZ" type="number" step="any">
		</div> 
		<div class="name-type namenote">(wrt plate center)&emsp;</div>
		 <div class="inputs-type inputs">
		<input id="setupscript-grapelocalpositiony_auto_false" name="setupScript,grapeLocalPositionY_Auto" type="hidden" value="FALSE">
		<input id="setupscript-grapelocalpositiony_auto_true" name="setupScript,grapeLocalPositionY_Auto" type="checkbox" value="TRUE">
		<label for="setupscript-grapelocalpositiony_auto_true" class="label-after-input label-end-block">Set Y automatically (grape rests on plate)</label>	
		</div>	
</fieldset> 
	
		<div class="fullrow-type largespace"></div> 
<fieldset class="trial-builder-group"> 
	<div class="name-type name">Size [m]:</div>
		 <div class="inputs-type inputs">
		<label for="setupscript-grapesizex" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-grapesizex" name="setupScript,grapeSizeX" type="number" step="any" min="0">
		<label for="setupscript-grapesizey" class="label-before-input">Y:</label>
		<input id="setupscript-grapesizey" name="setupScript,grapeSizeY" type="number" step="any" min="0">
		<label for="setupscript-grapesizez" class="label-before-input">Z:</label>
		<input id="setupscript-grapesizez" name="setupScript,grapeSizeZ" type="number" step="any" min="0">
		</div>   	
</fieldset> 
	
		<div class="fullrow-type largespace"></div> 
<fieldset class="trial-builder-group"> 
	<div class="name-type name">Physics:</div>
		 
		<div class="fullrow-type smallspace"></div>
		 
		<div class="name-type subname">Mass [kg]:</div>  
		 <div class="inputs-type inputs"> <input id="setupscript-grapemass" name="setupScript,grapeMass" type="number" step="any" min="0"></div>
		<div class="fullrow-type smallspace"></div>
		<div class="name-type subname">Drag:</div>  
		 <div class="inputs-type inputs">          
		<label for="setupscript-grapedrag" class="label-before-input label-start-block">Linear:</label>
		<input id="setupscript-grapedrag" name="setupScript,grapeDrag" type="number" step="any" min="0">
		<label for="setupscript-grapeangulardrag" class="label-before-input">Angular:</label>
		<input id="setupscript-grapeangulardrag" name="setupScript,grapeAngularDrag" type="number" step="any" min="0">
		</div>  
		<div class="fullrow-type smallspace"></div>  
		<div class="name-type subname">Friction w/ plate:</div>
		 <div class="inputs-type inputs">        
		<label for="setupscript-frictionplategrapedynamic" class="label-before-input label-start-block">Dynamic:</label>
		<input id="setupscript-frictionplategrapedynamic" name="setupScript,frictionPlateGrapeDynamic" type="number" step="any" min="0">
		<label for="setupscript-frictionplategrapestatic" class="label-before-input">Static:</label>
		<input id="setupscript-frictionplategrapestatic" name="setupScript,frictionPlateGrapeStatic" type="number" step="any" min="0">
		</div>  
		<div class="fullrow-type smallspace"></div>  
		<div class="name-type subname">Manipulation:</div>
		 <div class="inputs-type inputs">  
		<input id="grapescript-grapealwaysignorehands_false" name="grapeScript,grapeAlwaysIgnoreHands" type="hidden" value="FALSE">
		<input id="grapescript-grapealwaysignorehands_true" name="grapeScript,grapeAlwaysIgnoreHands" type="checkbox" value="TRUE">
		<label for="grapescript-grapealwaysignorehands_true" class="label-after-input label-end-block">Not allowed (ignore hands)</label>	
		</div>    	
</fieldset> 
	 		
 
 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
