<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
   	   
 
<fieldset class="trial-builder-group">   
	<div class="name-type name">Message:</div>
		 <div class="inputs-type inputs">      
		<!-- <label for="messagesscript-starttext" class="label-before-input label-start-block"></label> -->
		<textarea id="messagesscript-starttext" name="messagesScript,startText"></textarea>
		</div>  
</fieldset>   
	 




	<!-- Expandable Start Message Bubble -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableStartMessageBubble"><span>
	Expand bubble appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableStartMessageBubble"> 
 
	
<fieldset class="trial-builder-group">     
		<div class="name-type name">Position [m]: </div>
		 <div class="inputs-type inputs">
		<label for="setupscript-startmessagepositionx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-startmessagepositionx" name="setupScript,startMessagePositionX" type="number" step="any">
		<label for="setupscript-startmessagepositiony" class="label-before-input">Y:</label>
		<input id="setupscript-startmessagepositiony" name="setupScript,startMessagePositionY" type="number" step="any">
		<label for="setupscript-startmessagepositionz" class="label-before-input">Z:</label>
		<input id="setupscript-startmessagepositionz" name="setupScript,startMessagePositionZ" type="number" step="any">
		</div>  
</fieldset>	
			
		<div class="fullrow-type mediumspace"></div>   
<fieldset class="trial-builder-group">     
		<div class="name-type name">Orientation [deg]: </div>
		<div class="inputs-type inputs">
			<input id="setupscript-startmessagebackgroundrotationz" name="setupScript,startMessageBackgroundRotationZ" type="number" step="any">  
		</div> 
</fieldset>
			
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Size [m]:</div>
		 <div class="inputs-type inputs">
		<label for="setupscript-startmessagesizex" class="label-before-input label-start-block">Width:</label>
		<input id="setupscript-startmessagesizex" name="setupScript,startMessageSizeX" type="number" step="any" min="0">
		<label for="setupscript-startmessagesizey" class="label-before-input">Height:</label>
		<input id="setupscript-startmessagesizey" name="setupScript,startMessageSizeY" type="number" step="any" min="0">
		</div>   
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>
<fieldset class="trial-builder-group">    
		<div class="name-type name">Shape:</div> 
	<div class="inputs-type inputs">              
		<input id="setupscript-startmessagetype_cartoon" name="setupScript,startMessageType" type="radio" value="cartoon">
		<label for="setupscript-startmessagetype_cartoon" class="label-after-input">Cartoon</label> 
		<input id="setupscript-startmessagetype_rectangle" name="setupScript,startMessageType" type="radio" value="rectangle">
		<label for="setupscript-startmessagetype_rectangle" class="label-after-input">Rectangle</label>                 
		<input id="setupscript-startmessagetype_none" name="setupScript,startMessageType" type="radio" value="none">
		<label for="setupscript-startmessagetype_none" class="label-after-input">None</label> 
	</div> 
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">     
		<div class="name-type name">Color:</div> 			
		 <div class="inputs-type inputs">  
		<input type="color" id="setupscript-startmessagebackgroundcolor_picker" class="picker-color helper-input">
		<label for="setupscript-startmessagebackgroundcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-startmessagebackgroundcolorr" name="setupScript,startMessageBackgroundColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-startmessagebackgroundcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-startmessagebackgroundcolorg" name="setupScript,startMessageBackgroundColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-startmessagebackgroundcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-startmessagebackgroundcolorb" name="setupScript,startMessageBackgroundColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-startmessagebackgroundcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-startmessagebackgroundcoloralpha" name="setupScript,startMessageBackgroundColorAlpha" type="number" step="any" min="0" max="1">
		</div>   	
</fieldset>

	</div> <!-- END of expandable window -->
	
			
			
			
			
			<!-- Expandable Start Message Text -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableStartMessageText"><span>
	Expand text appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableStartMessageText">  
			
<fieldset class="trial-builder-group">  
		<div class="name-type name">Position [m]:</div>  
		<div class="inputs-type inputs">
		<label for="setupscript-startmessagetextoffsetx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-startmessagetextoffsetx" name="setupScript,startMessageTextOffsetX" type="number" step="any">
		<label for="setupscript-startmessagetextoffsety" class="label-before-input">Y:</label>
		<input id="setupscript-startmessagetextoffsety" name="setupScript,startMessageTextOffsetY" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Orientation [deg]:</div>   
		<div class="inputs-type inputs"> 
		<input id="setupscript-startmessagetextrotationz" name="setupScript,startMessageTextRotationZ" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Font size:</div>  
		 <div class="inputs-type inputs"> 
		<input id="setupscript-startmessagefontsize" name="setupScript,startMessageFontSize" type="number" step="any" min="0"> 
		</div>   
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Color:</div> 	
		<div class="inputs-type inputs"> 
		<input type="color" id="setupscript-startmessagetextcolor_picker" class="picker-color helper-input">
		<label for="setupscript-startmessagetextcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-startmessagetextcolorr" name="setupScript,startMessageTextColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-startmessagetextcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-startmessagetextcolorg" name="setupScript,startMessageTextColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-startmessagetextcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-startmessagetextcolorb" name="setupScript,startMessageTextColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-startmessagetextcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-startmessagetextcoloralpha" name="setupScript,startMessageTextColorAlpha" type="number" step="any" min="0" max="1">
		</div>  
</fieldset>   
	  

		</div> <!-- END of expandable window -->




 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
