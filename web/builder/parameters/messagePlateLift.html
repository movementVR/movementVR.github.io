<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
  
	
		   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Show?</div>
		 <div class="inputs-type inputs">
		<input id="messagesscript-stage4_displaymessageflag_false" name="messagesScript,stage4_displayMessageFlag" type="hidden" value="FALSE">
		<input id="messagesscript-stage4_displaymessageflag_true" name="messagesScript,stage4_displayMessageFlag" type="checkbox" value="TRUE">	
		<label for="messagesscript-stage4_displaymessageflag_true" class="label-after-input label-end-block">Yes</label>	 
		</div>    
</fieldset>   
	
		<div class="fullrow-type largespace"></div>   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Message:</div>
		 <div class="inputs-type inputs">      
		<!-- <label for="messagesscript-lifttext" class="label-before-input label-start-block"></label> -->
		<textarea id="messagesscript-lifttext" name="messagesScript,liftText"></textarea>
		</div>  
</fieldset>   
	 




	<!-- Expandable Lift Message Bubble -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableLiftMessageBubble"><span>
	Expand bubble appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableLiftMessageBubble"> 
 
	
<fieldset class="trial-builder-group">     
		<div class="name-type name">Position [m]: </div>
		 <div class="inputs-type inputs">
		<label for="setupscript-liftmessagepositionx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-liftmessagepositionx" name="setupScript,liftMessagePositionX" type="number" step="any">
		<label for="setupscript-liftmessagepositiony" class="label-before-input">Y:</label>
		<input id="setupscript-liftmessagepositiony" name="setupScript,liftMessagePositionY" type="number" step="any">
		<label for="setupscript-liftmessagepositionz" class="label-before-input">Z:</label>
		<input id="setupscript-liftmessagepositionz" name="setupScript,liftMessagePositionZ" type="number" step="any">
		</div>  
</fieldset>	
			
		<div class="fullrow-type mediumspace"></div>   
<fieldset class="trial-builder-group">     
		<div class="name-type name">Orientation [deg]: </div>
		<div class="inputs-type inputs">
			<input id="setupscript-liftmessagebackgroundrotationz" name="setupScript,liftMessageBackgroundRotationZ" type="number" step="any">  
		</div> 
</fieldset>
			
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Size [m]:</div>
		 <div class="inputs-type inputs">
		<label for="setupscript-liftmessagesizex" class="label-before-input label-start-block">Width:</label>
		<input id="setupscript-liftmessagesizex" name="setupScript,liftMessageSizeX" type="number" step="any" min="0">
		<label for="setupscript-liftmessagesizey" class="label-before-input">Height:</label>
		<input id="setupscript-liftmessagesizey" name="setupScript,liftMessageSizeY" type="number" step="any" min="0">
		</div>   
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>
<fieldset class="trial-builder-group">    
		<div class="name-type name">Shape:</div> 
	<div class="inputs-type inputs">              
		<input id="setupscript-liftmessagetype_cartoon" name="setupScript,liftMessageType" type="radio" value="cartoon">
		<label for="setupscript-liftmessagetype_cartoon" class="label-after-input">Cartoon</label> 
		<input id="setupscript-liftmessagetype_rectangle" name="setupScript,liftMessageType" type="radio" value="rectangle">
		<label for="setupscript-liftmessagetype_rectangle" class="label-after-input">Rectangle</label>                 
		<input id="setupscript-liftmessagetype_none" name="setupScript,liftMessageType" type="radio" value="none">
		<label for="setupscript-liftmessagetype_none" class="label-after-input">None</label> 
	</div> 
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">     
		<div class="name-type name">Color:</div> 			
		 <div class="inputs-type inputs">  
		<input type="color" id="setupscript-liftmessagebackgroundcolor_picker" class="picker-color helper-input">
		<label for="setupscript-liftmessagebackgroundcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-liftmessagebackgroundcolorr" name="setupScript,liftMessageBackgroundColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-liftmessagebackgroundcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-liftmessagebackgroundcolorg" name="setupScript,liftMessageBackgroundColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-liftmessagebackgroundcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-liftmessagebackgroundcolorb" name="setupScript,liftMessageBackgroundColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-liftmessagebackgroundcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-liftmessagebackgroundcoloralpha" name="setupScript,liftMessageBackgroundColorAlpha" type="number" step="any" min="0" max="1">
		</div>   	
</fieldset>

	</div> <!-- END of expandable window -->
	
			
			
			
			
			<!-- Expandable Lift Message Text -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableLiftMessageText"><span>
	Expand text appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableLiftMessageText">  
			
<fieldset class="trial-builder-group">  
		<div class="name-type name">Position [m]:</div>  
		<div class="inputs-type inputs">
		<label for="setupscript-liftmessagetextoffsetx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-liftmessagetextoffsetx" name="setupScript,liftMessageTextOffsetX" type="number" step="any">
		<label for="setupscript-liftmessagetextoffsety" class="label-before-input">Y:</label>
		<input id="setupscript-liftmessagetextoffsety" name="setupScript,liftMessageTextOffsetY" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Orientation [deg]:</div>   
		<div class="inputs-type inputs"> 
		<input id="setupscript-liftmessagetextrotationz" name="setupScript,liftMessageTextRotationZ" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Font size:</div>  
		 <div class="inputs-type inputs"> 
		<input id="setupscript-liftmessagefontsize" name="setupScript,liftMessageFontSize" type="number" step="any" min="0"> 
		</div>   
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Color:</div> 	
		<div class="inputs-type inputs"> 
		<input type="color" id="setupscript-liftmessagetextcolor_picker" class="picker-color helper-input">
		<label for="setupscript-liftmessagetextcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-liftmessagetextcolorr" name="setupScript,liftMessageTextColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-liftmessagetextcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-liftmessagetextcolorg" name="setupScript,liftMessageTextColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-liftmessagetextcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-liftmessagetextcolorb" name="setupScript,liftMessageTextColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-liftmessagetextcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-liftmessagetextcoloralpha" name="setupScript,liftMessageTextColorAlpha" type="number" step="any" min="0" max="1">
		</div>  
</fieldset>   
	  

		</div> <!-- END of expandable window -->




 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
