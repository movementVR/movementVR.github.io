<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
 
 
		   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Left:</div>
		 <div class="inputs-type inputs">	   
		<input id="setupscript-lefthandstartingboundmeshshape_hand" name="setupScript,lefthandStartingBoundMeshShape" type="radio" value="Hand">
		<label for="setupscript-lefthandstartingboundmeshshape_hand" class="label-after-input">Hand</label> 
		<input id="setupscript-lefthandstartingboundmeshshape_sphere" name="setupScript,lefthandStartingBoundMeshShape" type="radio" value="Sphere">
		<label for="setupscript-lefthandstartingboundmeshshape_sphere" class="label-after-input">Sphere</label> 
		<input id="setupscript-lefthandstartingboundmeshshape_cube" name="setupScript,lefthandStartingBoundMeshShape" type="radio" value="Cube">
		<label for="setupscript-lefthandstartingboundmeshshape_cube" class="label-after-input">Cube</label> 
		<input id="setupscript-lefthandstartingboundmeshshape_none" name="setupScript,lefthandStartingBoundMeshShape" type="radio" value="None">
		<label for="setupscript-lefthandstartingboundmeshshape_none" class="label-after-input label-end-block">None</label> 
		</div><div class="inputs-type inputs">    
			<input id="setupscript-lefthandstartingboundmeshpositionauto_false" name="setupScript,lefthandStartingBoundMeshPositionAuto" type="hidden" value="FALSE">
			<input id="setupscript-lefthandstartingboundmeshpositionauto_true" name="setupScript,lefthandStartingBoundMeshPositionAuto" type="checkbox" value="TRUE">
		<label for="setupscript-lefthandstartingboundmeshpositionauto_true" class="label-after-input">Automatic position</label>		
			<input id="setupscript-lefthandstartingboundmeshsizeauto_false" name="setupScript,lefthandStartingBoundMeshSizeAuto" type="hidden" value="FALSE">
			<input id="setupscript-lefthandstartingboundmeshsizeauto_true" name="setupScript,lefthandStartingBoundMeshSizeAuto" type="checkbox" value="TRUE">
		<label for="setupscript-lefthandstartingboundmeshsizeauto_true" class="label-after-input label-end-block">Automatic size</label>	
		</div>  
</fieldset>   
	
		<div class="fullrow-type largespace"></div>   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Right:</div>
		 <div class="inputs-type inputs">	
		<input id="setupscript-righthandstartingboundmeshshape_hand" name="setupScript,righthandStartingBoundMeshShape" type="radio" value="Hand">
		<label for="setupscript-righthandstartingboundmeshshape_hand" class="label-after-input">Hand</label> 
		<input id="setupscript-righthandstartingboundmeshshape_sphere" name="setupScript,righthandStartingBoundMeshShape" type="radio" value="Sphere">
		<label for="setupscript-righthandstartingboundmeshshape_sphere" class="label-after-input">Sphere</label> 
		<input id="setupscript-righthandstartingboundmeshshape_cube" name="setupScript,righthandStartingBoundMeshShape" type="radio" value="Cube">
		<label for="setupscript-righthandstartingboundmeshshape_cube" class="label-after-input">Cube</label> 
		<input id="setupscript-righthandstartingboundmeshshape_none" name="setupScript,righthandStartingBoundMeshShape" type="radio" value="None">
		<label for="setupscript-righthandstartingboundmeshshape_none" class="label-after-input label-end-block">None</label> 
		</div><div class="inputs-type inputs">    
			<input id="setupscript-righthandstartingboundmeshpositionauto_false" name="setupScript,righthandStartingBoundMeshPositionAuto" type="hidden" value="FALSE">
			<input id="setupscript-righthandstartingboundmeshpositionauto_true" name="setupScript,righthandStartingBoundMeshPositionAuto" type="checkbox" value="TRUE">
		<label for="setupscript-righthandstartingboundmeshpositionauto_true" class="label-after-input">Automatic position</label>	
			<input id="setupscript-righthandstartingboundmeshsizeauto_false" name="setupScript,righthandStartingBoundMeshSizeAuto" type="hidden" value="FALSE">
			<input id="setupscript-righthandstartingboundmeshsizeauto_true" name="setupScript,righthandStartingBoundMeshSizeAuto" type="checkbox" value="TRUE">
		<label for="setupscript-righthandstartingboundmeshsizeauto_true" class="label-after-input label-end-block">Automatic size</label>		
		</div>  
</fieldset>     
	
 
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableHandHomeVisual"><span>
	Expand to define position & size manually
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableHandHomeVisual">  
	
		   
	<fieldset class="trial-builder-group">   
		<div class="name-type name">Left position [m]:</div>
			 <div class="inputs-type inputs">
			<label for="setupscript-lefthandstartingboundmeshlocalpositionx" class="label-before-input label-start-block">X:</label>
			<input id="setupscript-lefthandstartingboundmeshlocalpositionx" name="setupScript,lefthandStartingBoundMeshLocalPositionX" type="number" step="any">
			<label for="setupscript-lefthandstartingboundmeshlocalpositiony" class="label-before-input">Y:</label>
			<input id="setupscript-lefthandstartingboundmeshlocalpositiony" name="setupScript,lefthandStartingBoundMeshLocalPositionY" type="number" step="any">
			<label for="setupscript-lefthandstartingboundmeshlocalpositionz" class="label-before-input">Z:</label>
			<input id="setupscript-lefthandstartingboundmeshlocalpositionz" name="setupScript,lefthandStartingBoundMeshLocalPositionZ" type="number" step="any">
			</div>   
		<div class="name-type namenote">(offset wrt to actual home)</div> 
</fieldset>   
	
		<div class="fullrow-type largespace"></div>   
	<fieldset class="trial-builder-group">   
		<div class="name-type name">Left size [m]:</div>
			 <div class="inputs-type inputs">
			<label for="setupscript-lefthandstartingboundmeshsizex" class="label-before-input label-start-block">X:</label>
			<input id="setupscript-lefthandstartingboundmeshsizex" name="setupScript,lefthandStartingBoundMeshSizeX" type="number" step="any" min="0">
			<label for="setupscript-lefthandstartingboundmeshsizey" class="label-before-input">Y:</label>
			<input id="setupscript-lefthandstartingboundmeshsizey" name="setupScript,lefthandStartingBoundMeshSizeY" type="number" step="any" min="0">
			<label for="setupscript-lefthandstartingboundmeshsizez" class="label-before-input">Z:</label>
			<input id="setupscript-lefthandstartingboundmeshsizez" name="setupScript,lefthandStartingBoundMeshSizeZ" type="number" step="any" min="0">
			</div>    
</fieldset>   
	
		<div class="fullrow-type largespace"></div>     
	<fieldset class="trial-builder-group">     
		<div class="name-type name">Right position [m]:</div>
			 <div class="inputs-type inputs">
			<label for="setupscript-righthandstartingboundmeshlocalpositionx" class="label-before-input label-start-block">X:</label>
			<input id="setupscript-righthandstartingboundmeshlocalpositionx" name="setupScript,righthandStartingBoundMeshLocalPositionX" type="number" step="any">
			<label for="setupscript-righthandstartingboundmeshlocalpositiony" class="label-before-input">Y:</label>
			<input id="setupscript-righthandstartingboundmeshlocalpositiony" name="setupScript,righthandStartingBoundMeshLocalPositionY" type="number" step="any">
			<label for="setupscript-righthandstartingboundmeshlocalpositionz" class="label-before-input">Z:</label>
			<input id="setupscript-righthandstartingboundmeshlocalpositionz" name="setupScript,righthandStartingBoundMeshLocalPositionZ" type="number" step="any">
			</div>   
		<div class="name-type namenote">(offset wrt to actual home)</div> 
</fieldset>   
	
		<div class="fullrow-type largespace"></div>   
	<fieldset class="trial-builder-group">   
		<div class="name-type name">Right size [m]:</div>
			 <div class="inputs-type inputs">
			<label for="setupscript-righthandstartingboundmeshsizex" class="label-before-input label-start-block">X:</label>
			<input id="setupscript-righthandstartingboundmeshsizex" name="setupScript,righthandStartingBoundMeshSizeX" type="number" step="any" min="0">
			<label for="setupscript-righthandstartingboundmeshsizey" class="label-before-input">Y:</label>
			<input id="setupscript-righthandstartingboundmeshsizey" name="setupScript,righthandStartingBoundMeshSizeY" type="number" step="any" min="0">
			<label for="setupscript-righthandstartingboundmeshsizez" class="label-before-input">Z:</label>
			<input id="setupscript-righthandstartingboundmeshsizez" name="setupScript,righthandStartingBoundMeshSizeZ" type="number" step="any" min="0">
			</div>  
</fieldset>   
	

		</div>   	
	

<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
