<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
  
	
		   
<fieldset class="trial-builder-group">   
	<div class="name-type name"> Trial number display </div> 

	<div class="fullrow-type smallspace"></div> 

	<div class="name-type subname">Base string:</div>
		 <div class="inputs-type inputs">      
		<!-- <label for="messagesscript-trialnumberbasetext" class="label-before-input label-start-block"></label> -->
		<textarea id="messagesscript-trialnumberbasetext" name="messagesScript,trialNumberBaseText"></textarea>
		</div>         
		
		 <div class="inputs-type inputs">	    
		<input id="messagesscript-trialnumberauto_false" name="messagesScript,trialNumberAuto" type="hidden" value="FALSE">
		<input id="messagesscript-trialnumberauto_true" name="messagesScript,trialNumberAuto" type="checkbox" value="TRUE">
		<label for="messagesscript-trialnumberauto_true" class="label-after-input label-end-block">Append trial number to string</label>		
		</div>   
</fieldset> 

	<!-- Expandable Trial Message Bubble -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableTrialMessageBubble"><span>
	Expand bubble appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableTrialMessageBubble"> 
 
	
<fieldset class="trial-builder-group">     
		<div class="name-type name">Position [m]: </div>
		 <div class="inputs-type inputs">
		<label for="setupscript-trialnumbermessagepositionx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-trialnumbermessagepositionx" name="setupScript,trialNumberMessagePositionX" type="number" step="any">
		<label for="setupscript-trialnumbermessagepositiony" class="label-before-input">Y:</label>
		<input id="setupscript-trialnumbermessagepositiony" name="setupScript,trialNumberMessagePositionY" type="number" step="any">
		<label for="setupscript-trialnumbermessagepositionz" class="label-before-input">Z:</label>
		<input id="setupscript-trialnumbermessagepositionz" name="setupScript,trialNumberMessagePositionZ" type="number" step="any">
		</div>  
</fieldset>	
			
		<div class="fullrow-type mediumspace"></div>   
<fieldset class="trial-builder-group">     
		<div class="name-type name">Orientation [deg]: </div>
		<div class="inputs-type inputs">
			<input id="setupscript-trialnumbermessagebackgroundrotationz" name="setupScript,trialNumberMessageBackgroundRotationZ" type="number" step="any">  
		</div> 
</fieldset>
			
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Size [m]:</div>
		 <div class="inputs-type inputs">
		<label for="setupscript-trialnumbermessagesizex" class="label-before-input label-start-block">Width:</label>
		<input id="setupscript-trialnumbermessagesizex" name="setupScript,trialNumberMessageSizeX" type="number" step="any" min="0">
		<label for="setupscript-trialnumbermessagesizey" class="label-before-input">Height:</label>
		<input id="setupscript-trialnumbermessagesizey" name="setupScript,trialNumberMessageSizeY" type="number" step="any" min="0">
		</div>   
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>
<fieldset class="trial-builder-group">    
		<div class="name-type name">Shape:</div> 
	<div class="inputs-type inputs">              
		<input id="setupscript-trialnumbermessagetype_cartoon" name="setupScript,trialNumberMessageType" type="radio" value="cartoon">
		<label for="setupscript-trialnumbermessagetype_cartoon" class="label-after-input">Cartoon</label> 
		<input id="setupscript-trialnumbermessagetype_rectangle" name="setupScript,trialNumberMessageType" type="radio" value="rectangle">
		<label for="setupscript-trialnumbermessagetype_rectangle" class="label-after-input">Rectangle</label>                 
		<input id="setupscript-trialnumbermessagetype_none" name="setupScript,trialNumberMessageType" type="radio" value="none">
		<label for="setupscript-trialnumbermessagetype_none" class="label-after-input">None</label> 
	</div> 
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">     
		<div class="name-type name">Color:</div> 			
		 <div class="inputs-type inputs">  
		<input type="color" id="setupscript-trialnumbermessagebackgroundcolor_picker" class="picker-color helper-input">
		<label for="setupscript-trialnumbermessagebackgroundcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-trialnumbermessagebackgroundcolorr" name="setupScript,trialNumberMessageBackgroundColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-trialnumbermessagebackgroundcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-trialnumbermessagebackgroundcolorg" name="setupScript,trialNumberMessageBackgroundColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-trialnumbermessagebackgroundcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-trialnumbermessagebackgroundcolorb" name="setupScript,trialNumberMessageBackgroundColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-trialnumbermessagebackgroundcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-trialnumbermessagebackgroundcoloralpha" name="setupScript,trialNumberMessageBackgroundColorAlpha" type="number" step="any" min="0" max="1">
		</div>   	
</fieldset>

	</div> <!-- END of expandable window -->
	
			
			
			
			
			<!-- Expandable Trial Message Text -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableTrialMessageText"><span>
	Expand text appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableTrialMessageText">  
			
<fieldset class="trial-builder-group">  
		<div class="name-type name">Position [m]:</div>  
		<div class="inputs-type inputs">
		<label for="setupscript-trialnumbermessagetextoffsetx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-trialnumbermessagetextoffsetx" name="setupScript,trialNumberMessageTextOffsetX" type="number" step="any">
		<label for="setupscript-trialnumbermessagetextoffsety" class="label-before-input">Y:</label>
		<input id="setupscript-trialnumbermessagetextoffsety" name="setupScript,trialNumberMessageTextOffsetY" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Orientation [deg]:</div>   
		<div class="inputs-type inputs"> 
		<input id="setupscript-trialnumbermessagetextrotationz" name="setupScript,trialNumberMessageTextRotationZ" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Font size:</div>  
		 <div class="inputs-type inputs"> 
		<input id="setupscript-trialnumbermessagefontsize" name="setupScript,trialNumberMessageFontSize" type="number" step="any" min="0"> 
		</div>   
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Color:</div> 	
		<div class="inputs-type inputs"> 
		<input type="color" id="setupscript-trialnumbermessagetextcolor_picker" class="picker-color helper-input">
		<label for="setupscript-trialnumbermessagetextcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-trialnumbermessagetextcolorr" name="setupScript,trialNumberMessageTextColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-trialnumbermessagetextcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-trialnumbermessagetextcolorg" name="setupScript,trialNumberMessageTextColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-trialnumbermessagetextcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-trialnumbermessagetextcolorb" name="setupScript,trialNumberMessageTextColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-trialnumbermessagetextcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-trialnumbermessagetextcoloralpha" name="setupScript,trialNumberMessageTextColorAlpha" type="number" step="any" min="0" max="1">
		</div>  
</fieldset>   
	  

		</div> <!-- END of expandable window -->




 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
