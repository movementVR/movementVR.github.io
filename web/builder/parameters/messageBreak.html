<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
<form class="param-form">
        
<!-- Content: --> 
  
	
		   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Show?</div>
		 <div class="inputs-type inputs">
		<input id="messagesscript-stage6_displaymessageflag_false" name="messagesScript,stage6_displayMessageFlag" type="hidden" value="FALSE">
		<input id="messagesscript-stage6_displaymessageflag_true" name="messagesScript,stage6_displayMessageFlag" type="checkbox" value="TRUE">	
		<label for="messagesscript-stage6_displaymessageflag_true" class="label-after-input label-end-block">Yes</label>	 
		</div>    
</fieldset>   
	
		<div class="fullrow-type largespace"></div>   
<fieldset class="trial-builder-group">   
	<div class="name-type name">Message:</div>
		 <div class="inputs-type inputs">      
		<!-- <label for="messagesscript-breaktext" class="label-before-input label-start-block"></label> -->
		<textarea id="messagesscript-breaktext" name="messagesScript,breakText"></textarea>
		</div>  
</fieldset>   
	 




	<!-- Expandable Break Message Bubble -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableBreakMessageBubble"><span>
	Expand bubble appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableBreakMessageBubble"> 
 
	
<fieldset class="trial-builder-group">     
		<div class="name-type name">Position [m]: </div>
		 <div class="inputs-type inputs">
		<label for="setupscript-breakmessagepositionx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-breakmessagepositionx" name="setupScript,breakMessagePositionX" type="number" step="any">
		<label for="setupscript-breakmessagepositiony" class="label-before-input">Y:</label>
		<input id="setupscript-breakmessagepositiony" name="setupScript,breakMessagePositionY" type="number" step="any">
		<label for="setupscript-breakmessagepositionz" class="label-before-input">Z:</label>
		<input id="setupscript-breakmessagepositionz" name="setupScript,breakMessagePositionZ" type="number" step="any">
		</div>  
</fieldset>	
			
		<div class="fullrow-type mediumspace"></div>   
<fieldset class="trial-builder-group">     
		<div class="name-type name">Orientation [deg]: </div>
		<div class="inputs-type inputs">
			<input id="setupscript-breakmessagebackgroundrotationz" name="setupScript,breakMessageBackgroundRotationZ" type="number" step="any">  
		</div> 
</fieldset>
			
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Size [m]:</div>
		 <div class="inputs-type inputs">
		<label for="setupscript-breakmessagesizex" class="label-before-input label-start-block">Width:</label>
		<input id="setupscript-breakmessagesizex" name="setupScript,breakMessageSizeX" type="number" step="any" min="0">
		<label for="setupscript-breakmessagesizey" class="label-before-input">Height:</label>
		<input id="setupscript-breakmessagesizey" name="setupScript,breakMessageSizeY" type="number" step="any" min="0">
		</div>   
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>
<fieldset class="trial-builder-group">    
		<div class="name-type name">Shape:</div> 
	<div class="inputs-type inputs">              
		<input id="setupscript-breakmessagetype_cartoon" name="setupScript,breakMessageType" type="radio" value="cartoon">
		<label for="setupscript-breakmessagetype_cartoon" class="label-after-input">Cartoon</label> 
		<input id="setupscript-breakmessagetype_rectangle" name="setupScript,breakMessageType" type="radio" value="rectangle">
		<label for="setupscript-breakmessagetype_rectangle" class="label-after-input">Rectangle</label>                 
		<input id="setupscript-breakmessagetype_none" name="setupScript,breakMessageType" type="radio" value="none">
		<label for="setupscript-breakmessagetype_none" class="label-after-input">None</label> 
	</div> 
</fieldset>
	
		<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">     
		<div class="name-type name">Color:</div> 			
		 <div class="inputs-type inputs">  
		<input type="color" id="setupscript-breakmessagebackgroundcolor_picker" class="picker-color helper-input">
		<label for="setupscript-breakmessagebackgroundcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-breakmessagebackgroundcolorr" name="setupScript,breakMessageBackgroundColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-breakmessagebackgroundcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-breakmessagebackgroundcolorg" name="setupScript,breakMessageBackgroundColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-breakmessagebackgroundcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-breakmessagebackgroundcolorb" name="setupScript,breakMessageBackgroundColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-breakmessagebackgroundcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-breakmessagebackgroundcoloralpha" name="setupScript,breakMessageBackgroundColorAlpha" type="number" step="any" min="0" max="1">
		</div>   	
</fieldset>

	</div> <!-- END of expandable window -->
	
			
			
			
			
			<!-- Expandable Break Message Text -->

	<div class="fullrow-type smallspace"></div>
	<button class="inputs-type expand-button collapsed" type="button" data-target="#expandableBreakMessageText"><span>
	Expand text appearance
	</span></button>

		<div class="fullrow-type expand-window collapsed" id="expandableBreakMessageText">  
			
<fieldset class="trial-builder-group">  
		<div class="name-type name">Position [m]:</div>  
		<div class="inputs-type inputs">
		<label for="setupscript-breakmessagetextoffsetx" class="label-before-input label-start-block">X:</label>
		<input id="setupscript-breakmessagetextoffsetx" name="setupScript,breakMessageTextOffsetX" type="number" step="any">
		<label for="setupscript-breakmessagetextoffsety" class="label-before-input">Y:</label>
		<input id="setupscript-breakmessagetextoffsety" name="setupScript,breakMessageTextOffsetY" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group"> 
		<div class="name-type name">Orientation [deg]:</div>   
		<div class="inputs-type inputs"> 
		<input id="setupscript-breakmessagetextrotationz" name="setupScript,breakMessageTextRotationZ" type="number" step="any">
		</div>	
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Font size:</div>  
		 <div class="inputs-type inputs"> 
		<input id="setupscript-breakmessagefontsize" name="setupScript,breakMessageFontSize" type="number" step="any" min="0"> 
		</div>   
</fieldset>   
		
			<div class="fullrow-type mediumspace"></div>  
<fieldset class="trial-builder-group">   
		<div class="name-type name">Color:</div> 	
		<div class="inputs-type inputs"> 
		<input type="color" id="setupscript-breakmessagetextcolor_picker" class="picker-color helper-input">
		<label for="setupscript-breakmessagetextcolorr" class="label-before-input hidden-color hidden-label">R:</label>
		<input id="setupscript-breakmessagetextcolorr" name="setupScript,breakMessageTextColorR" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-breakmessagetextcolorg" class="label-before-input hidden-color hidden-label">G:</label>
		<input id="setupscript-breakmessagetextcolorg" name="setupScript,breakMessageTextColorG" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-breakmessagetextcolorb" class="label-before-input hidden-color hidden-label">B:</label>
		<input id="setupscript-breakmessagetextcolorb" name="setupScript,breakMessageTextColorB" class="hidden-color hidden-input" type="number" step="any" min="0" max="1">
		<label for="setupscript-breakmessagetextcoloralpha" class="label-before-input">Alpha:</label>
		<input id="setupscript-breakmessagetextcoloralpha" name="setupScript,breakMessageTextColorAlpha" type="number" step="any" min="0" max="1">
		</div>  
</fieldset>   
	  

		</div> <!-- END of expandable window -->




 
<!-- End of Content --> 
 
</form> 
<div class="param-img">
 <!-- <img src="trialDesignFiles/figures/paradigmSmall-01.png"  > --> 
</div>
        
</body> 
</html>
